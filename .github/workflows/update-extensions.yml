name: Update extensions

# Builds every extension listed in .github/extensions.json and publishes the ones
# that changed. See that file for which extensions are included and why some are
# pinned to a fixed upstream revision.
#
# Nothing needs configuring: on the first run a signing key is generated and
# committed to signing/ so that every later build has the same signature.
# To use a private key instead, set these repository secrets (they take
# precedence): SIGNING_KEY (base64 of a .jks), ALIAS, KEY_STORE_PASSWORD, KEY_PASSWORD.
#
# Every run rewrites ci-report.json, which records per-extension status, the reason
# for skipping anything, and the tail of the Gradle log on failure - GitHub's own
# job logs require authentication to read, so this is the audit trail.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Build a single module, e.g. src/zh/wnacg (empty = all)"
        required: false
        type: string
      watch_only:
        description: "Only check upstream for changes; do not build anything"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  push:
    branches: [main]
    paths:
      - .github/extensions.json
      - .github/scripts/**
      - .github/workflows/update-extensions.yml

permissions:
  contents: write

concurrency:
  group: update-extensions
  cancel-in-progress: false

jobs:
  update:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: self

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and publish extensions
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ARGS=()
          if [ -n "${{ inputs.only }}" ]; then ARGS+=(--only "${{ inputs.only }}"); fi
          if [ "${{ inputs.watch_only }}" = "true" ]; then ARGS+=(--watch-only); fi
          python3 self/.github/scripts/build_extensions.py --repo self "${ARGS[@]}"

      - name: Summarise
        if: always()
        working-directory: self
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          path = pathlib.Path("ci-report.json")
          if not path.exists():
              print("no report written")
              raise SystemExit(0)
          report = json.loads(path.read_text())
          print(f"### Extension update run\n")
          print(f"keystore: `{report['keystore'].get('source')}`"
                + (f" (sha256 `{report['keystore']['sha256'][:16]}…`)" if report['keystore'].get('sha256') else ""))
          print("\n| module | status | version | detail |")
          print("|---|---|---|---|")
          for r in report["results"]:
              print(f"| `{r['module']}` | {r['status']} | {r['version']} | {r['reason']} |")
          notable = [w for w in report["watch"] if w["status"] in ("CHANGED", "returned", "dropped")]
          if notable:
              print("\n**Upstream changes worth a look:**\n")
              for w in notable:
                  print(f"- `{w['module']}`: {w['status']} - {w['detail']}")
          PY

      - name: Commit and push
        if: always()
        working-directory: self
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A repo ci-report.json
          if [ -d signing ]; then git add -A signing; fi
          if git diff --cached --quiet; then
            echo "nothing to publish"
            exit 0
          fi
          MSG=$(python3 -c "import json;r=json.load(open('ci-report.json'));p=[x['pkg'].rsplit('.',1)[-1] for x in r['results'] if x['status']=='published'];print('Update extensions: '+', '.join(p) if p else 'Update extensions: housekeeping')")
          git commit -m "$MSG"
          git push origin HEAD:main
